[project]
name = "production-line-sim"
version = "0.1.0"
description = "Simulated production line of ZPL/TSC label printers with a control API for demos and tests"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Etiketron contributors" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Printing",
]

[project.scripts]
production-line-sim = "printer_sim.cli:main"

[project.optional-dependencies]
opcua = ["asyncua>=2.0"]
enip = ["cpppo>=4.0"]
s7 = ["python-snap7>=1.3"]
all = ["asyncua>=2.0", "cpppo>=4.0", "python-snap7>=1.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["printer_sim"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
